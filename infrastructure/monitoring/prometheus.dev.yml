global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: lobby-service-health
    metrics_path: /health/ready
    static_configs:
      - targets: ['lobby-service:4000']