name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamecenter
          POSTGRES_PASSWORD: gamecenter
          POSTGRES_DB: gamecenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gamecenter -d gamecenter"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    env:
      POSTGRES_URL: postgresql://gamecenter:gamecenter@localhost:5432/gamecenter
      REDIS_URL: redis://localhost:6379
      NATS_URL: nats://localhost:4222

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Static validators
        run: npm run validate

      - name: Unit tests
        run: npm run test:unit

      - name: Database migrations
        run: npm run db:migrate

      - name: Seed catalog
        run: npm run db:seed

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Validate compose config
        run: docker compose config > /dev/null

      - name: Validate layered compose config
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null